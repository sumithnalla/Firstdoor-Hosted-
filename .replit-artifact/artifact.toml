kind = "web"
previewPath = "/"
title = "FirstDoor - Hyderabad Real Estate"
version = "1.0.0"
id = "artifacts/firstdoor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21678

[services.development]
run = "pnpm --filter @workspace/firstdoor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firstdoor", "run", "build" ]
publicDir = "artifacts/firstdoor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21678"
BASE_PATH = "/"
